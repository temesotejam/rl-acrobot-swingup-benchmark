ppo:
  learning_rate: 0.0003
  n_envs: 4
  n_steps: 625
  n_steps_quick: 375
  batch_size: 250
  batch_size_quick: 250
  n_epochs: 10
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
  use_sde: true
  sde_sample_freq: 4
  net_arch: [128, 128]

sac:
  learning_rate: 0.0003
  min_learning_rate: 0.0001
  rollback_learning_rate_factor: 0.70
  recovery_refill_steps: 5000
  restore_replay_buffer_on_rollback: false
  buffer_size: 800000
  learning_starts: 5000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  target_update_interval: 1
  net_arch: [256, 256]

td3:
  learning_rate: 0.0003
  min_learning_rate: 0.00005
  rollback_learning_rate_factor: 0.50
  recovery_refill_steps: 5000
  restore_replay_buffer_on_rollback: false
  buffer_size: 800000
  learning_starts: 5000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 2
  gradient_steps: 1
  action_noise_sigma: 0.15
  policy_delay: 2
  target_policy_noise: 0.10
  target_noise_clip: 0.25
  net_arch: [256, 256]

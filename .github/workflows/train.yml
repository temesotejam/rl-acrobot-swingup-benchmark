name: Train Acrobot Benchmark

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Training length
        required: true
        default: normal
        type: choice
        options: [quick, normal, long]
      seed:
        description: Random seed
        required: true
        default: "42"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/training-trigger/**"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  MPLBACKEND: Agg
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  TRAIN_PRESET: ${{ inputs.preset || 'normal' }}
  TRAIN_SEED: ${{ inputs.seed || '42' }}

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        algorithm: [ppo, sac, td3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Show request
        run: |
          echo "algorithm=${{ matrix.algorithm }}"
          echo "preset=${TRAIN_PRESET}"
          echo "seed=${TRAIN_SEED}"
      - name: Train and evaluate
        run: python -m src.train --algorithm "${{ matrix.algorithm }}" --preset "${TRAIN_PRESET}" --seed "${TRAIN_SEED}" --output-dir "results/${{ matrix.algorithm }}"
      - name: Add summary
        if: always()
        run: |
          if [ -f "results/${{ matrix.algorithm }}/summary.md" ]; then cat "results/${{ matrix.algorithm }}/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: acrobot-${{ matrix.algorithm }}-${{ env.TRAIN_PRESET }}-seed-${{ env.TRAIN_SEED }}-run-${{ github.run_number }}
          path: results/${{ matrix.algorithm }}/
          if-no-files-found: error
          retention-days: 30

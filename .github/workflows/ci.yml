name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  MPLBACKEND: Agg
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  smoke:
    needs: unit-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        algorithm: [ppo, sac, td3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run real quick benchmark training
        run: python -m src.train --algorithm "${{ matrix.algorithm }}" --preset quick --seed 42 --output-dir "ci-results/${{ matrix.algorithm }}"
      - name: Verify outputs
        run: |
          test -f "ci-results/${{ matrix.algorithm }}/summary.md"
          test -f "ci-results/${{ matrix.algorithm }}/metrics.csv"
          test -f "ci-results/${{ matrix.algorithm }}/metadata.json"
          test -f "ci-results/${{ matrix.algorithm }}/best-checkpoint.json"
          test -f "ci-results/${{ matrix.algorithm }}/models/best.zip"
          test -f "ci-results/${{ matrix.algorithm }}/models/final.zip"
          test -f "ci-results/${{ matrix.algorithm }}/videos/best.mp4"
          test -f "ci-results/${{ matrix.algorithm }}/videos/final.mp4"
          test -f "ci-results/${{ matrix.algorithm }}/plots/stable_ratio.png"
          grep -q '^final_model,' "ci-results/${{ matrix.algorithm }}/metrics.csv"
          head -1 "ci-results/${{ matrix.algorithm }}/metrics.csv" | grep -q 'stable_ratio'
          python - <<'PY'
          import json, os
          from pathlib import Path
          algorithm = os.environ["ALGORITHM"]
          metadata = json.loads(Path(f"ci-results/{algorithm}/metadata.json").read_text())
          assert metadata["final_checkpoint"]["stage"] == "final_model"
          assert 0.0 <= float(metadata["final_model_difficulty"]) <= 1.0
          assert metadata["reward"]["version"] == "v6-continuous-stability"
          assert "stable_ratio" in metadata["final_checkpoint"]
          assert "rollback_count" in metadata
          assert float(metadata["final_learning_rate"]) > 0.0
          cfg = metadata["algorithm_config"]
          if algorithm in {"sac", "td3"}:
              assert cfg["restore_replay_buffer_on_rollback"] is False
              assert int(cfg["recovery_refill_steps"]) > 0
              assert float(cfg["rollback_learning_rate_factor"]) < 1.0
          if algorithm == "td3":
              assert abs(float(cfg["learning_rate"]) - 0.0003) < 1e-12
              assert int(cfg["train_freq"]) == 2
          PY
        env:
          ALGORITHM: ${{ matrix.algorithm }}
      - name: Build dashboard smoke test
        run: |
          python web/build_pages.py --root ci-results --output site --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          test -f site/index.html
          test -f "site/${{ matrix.algorithm }}/videos/best.mp4"
          test -f "site/${{ matrix.algorithm }}/videos/final.mp4"
          grep -q '実際に保存された final model' site/index.html
          grep -q 'Stable dwell' site/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: acrobot-${{ matrix.algorithm }}-smoke-${{ github.run_number }}
          path: ci-results/${{ matrix.algorithm }}/
          retention-days: 14

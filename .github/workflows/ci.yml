name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  MPLBACKEND: Agg
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  smoke:
    needs: unit-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        algorithm: [ppo, sac, td3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run real quick benchmark training
        run: python -m src.train --algorithm "${{ matrix.algorithm }}" --preset quick --seed 42 --output-dir "ci-results/${{ matrix.algorithm }}"
      - name: Verify outputs
        run: |
          test -f "ci-results/${{ matrix.algorithm }}/summary.md"
          test -f "ci-results/${{ matrix.algorithm }}/metrics.csv"
          test -f "ci-results/${{ matrix.algorithm }}/best-checkpoint.json"
          test -f "ci-results/${{ matrix.algorithm }}/models/best.zip"
          test -f "ci-results/${{ matrix.algorithm }}/models/final.zip"
          test -f "ci-results/${{ matrix.algorithm }}/videos/best.mp4"
          test -f "ci-results/${{ matrix.algorithm }}/videos/final.mp4"
      - name: Build dashboard smoke test
        run: |
          python web/build_pages.py --root ci-results --output site --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          test -f site/index.html
          test -f "site/${{ matrix.algorithm }}/videos/best.mp4"
          test -f "site/${{ matrix.algorithm }}/videos/final.mp4"
      - uses: actions/upload-artifact@v7
        with:
          name: acrobot-${{ matrix.algorithm }}-smoke-${{ github.run_number }}
          path: ci-results/${{ matrix.algorithm }}/
          retention-days: 14
